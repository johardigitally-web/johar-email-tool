{% extends 'base.html' %}
{% block title %}Sign in &middot; Email Marketing{% endblock %}
{% block content %}
<div class="card" style="max-width:380px;margin:8vh auto">
  <h1>Sign in</h1>
  <p class="hint">This tool can send email on behalf of your shop.</p>
  {% if error %}<div class="note warn"><svg><use href="#i-warn"/></svg><span>{{ error }}</span></div>{% endif %}
  <form method="post">
    <label><span class="lbl">Password</span><input type="password" name="password" autofocus required></label>
    <button class="btn primary" type="submit">Sign in</button>
  </form>
</div>
{% endblock %}
