# __SITE__ -> the mailer on 127.0.0.1:8010
#
# deploy/provision.sh substitutes __SITE__ with the hostname before installing
# this, so the copy in the repo carries nobody's domain.
#
# Deliberately NOT a default_server and no bare IP is listed: on a machine that
# hosts more than this tool, the other site keeps whatever asks for it by
# address, and this one only ever answers to its own name. Certbot rewrites this
# file when the certificate is issued.

# The login rate limit lives here rather than in the main nginx.conf so this
# site works on a machine with nothing else on it. 12 tries a minute per IP:
# room for somebody who keeps mistyping, far too slow to guess a password.
limit_req_zone $binary_remote_addr zone=mailer_login:1m rate=12r/m;

server {
    listen 80;
    server_name __SITE__;

    # A newsletter is text. Nothing legitimate posts 20 MB here.
    client_max_body_size 4M;

    location = /login {
        limit_req zone=mailer_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
